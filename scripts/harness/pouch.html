<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pouch addon harness</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #e3e8eb; font: 12px/1.4 system-ui, sans-serif; color: #1c232b; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .ui { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; max-width: calc(100% - 24px); }
      .ui button { font: inherit; padding: 6px 10px; border-radius: 999px; border: 1px solid rgb(0 0 0 / 0.15); background: rgb(255 255 255 / 0.7); color: inherit; cursor: pointer; }
      .ui .log { opacity: 0.7; }
      .tip { position: fixed; pointer-events: none; padding: 3px 8px; border-radius: 6px; background: #1c232b; color: #e3e8eb; transform: translate(12px, 12px); display: none; }
    </style>
  </head>

    <script type="module" src="./pouch.tsx"></script>
  </body>
