<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Paper harness</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --paper: #e3e8eb;
        --ink: #1c232b;
        --mute: #4f5d69;
        color-scheme: light;
      }
      /* the detail view: the desk under the frosted veil (rgb(233 238 241 / .6) over the desk, blurred) */
      :root[data-bg="scrim"],
      :root[data-bg="veil"] {
        --paper: #e7ecef;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font: 500 11.5px/16px system-ui, sans-serif;
        letter-spacing: 0.06em;
      }
      #host {
        position: absolute;
        inset: 0;
      }
      #hud {
        position: absolute;
        left: 16px;
        bottom: 12px;
        color: var(--mute);
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
      #fallback {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--mute);
      }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <div id="hud" aria-live="polite"></div>
    <script type="module" src="./paper.tsx"></script>
  </body>
</html>
