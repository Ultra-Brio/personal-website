<script>
/* 随笔目录渲染：优先 essays-manifest.json（线上部署时自动生成 / serve.py 动态提供），
   直接双击 html 打开时退回到 js/essays.js 的兜底列表 */
(function () {
  const list = document.getElementById("essayList");
  function render(items) {
    if (!items.length) {
      list.innerHTML = '<p class="essays-empty">第一篇正在路上。</p>';
      return;
    }
    list.innerHTML = items.map((e) => `
      <a class="essay-card" href="essay.html?slug=${encodeURIComponent(e.slug)}">
        <span class="essay-date">${e.date}</span>
        <span class="essay-tag">${e.tag || "随笔"}</span>
        <h3>${e.title}</h3>
        <p>${e.excerpt || ""}</p>
        <span class="essay-arrow">→</span>
      </a>`).join("");
  }
  fetch("essays-manifest.json")
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then((d) => render(d.essays))
    .catch(() => render(window.ESSAYS || []));
})();
</script>
