<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">向博 · 个人主页</title>
<meta name="description" content="向博的个人网站 —— 在医学、商业与公共生活之间找交叉点">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@600;700;900&display=swap">
</head>
<body data-page="home" class="constellation-page">

<!-- 顶部：仅名字与语言切换，无其他入口 -->
<div class="constellation-top">
  <a class="nav-logo" href="index.html" data-i18n="navLogo">向博</a>
  <button class="lang-toggle" id="langToggle" aria-label="切换语言">
    <span class="lang-option" data-lang-btn="zh">中</span>
    <span class="lang-divider">/</span>
    <span class="lang-option" data-lang-btn="en">EN</span>
  </button>
</div>

<!-- ============ 全屏大图 + 散布模块（位置每次随机） ============ -->
<div class="constellation" id="constellation">
  <div class="constellation-bg" style="background-image:url('assets/images/la.jpg')"></div>
  <div class="constellation-veil"></div>

  <div class="constellation-name" aria-hidden="true">
    <span class="cn">向博</span>
    <span class="en">Xiang Bo</span>
  </div>

  <a class="orb" href="about.html">
    <span class="orb-in"><span class="orb-card">
      <img src="assets/images/tokyo.jpg" alt="">
      <span class="orb-label" data-i18n="navAbout">关于</span>
    </span></span>
  </a>

  <a class="orb" href="journey.html">
    <span class="orb-in"><span class="orb-card">
      <img src="assets/images/nyc.jpg" alt="">
      <span class="orb-label" data-i18n="navJourney">足迹</span>
    </span></span>
  </a>

  <a class="orb" href="essays.html">
    <span class="orb-in"><span class="orb-card">
      <img src="assets/images/fuji.jpg" alt="">
      <span class="orb-label" data-i18n="navEssays">随笔</span>
    </span></span>
  </a>

  <a class="orb" href="gallery.html">
    <span class="orb-in"><span class="orb-card">
      <img src="assets/gallery/placeholder-6.svg" alt="">
      <span class="orb-label" data-i18n="navGallery">相册</span>
    </span></span>
  </a>

  <a class="orb" href="contact.html">
    <span class="orb-in"><span class="orb-card">
      <img src="assets/gallery/placeholder-5.svg" alt="">
      <span class="orb-label" data-i18n="navContact">联络</span>
    </span></span>
  </a>
</div>

<!-- 点击模块时的全屏转场层 -->
<div class="orb-veil" id="orbVeil"></div>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
