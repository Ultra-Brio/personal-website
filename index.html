<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">向博 · 个人主页</title>
<meta name="description" content="向博的个人网站 —— 在医学、商业与公共生活之间找交叉点">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@600;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
</head>
<body data-page="home" class="constellation-page">

<!-- 顶部：仅名字与语言切换 -->
<div class="constellation-top">
  <a class="nav-logo" href="index.html" data-i18n="navLogo">向博</a>
  <button class="lang-toggle" id="langToggle" aria-label="切换语言">
    <span class="lang-option" data-lang-btn="zh">中</span>
    <span class="lang-divider">/</span>
    <span class="lang-option" data-lang-btn="en">EN</span>
  </button>
</div>

<!-- 右缘竖排柱标题（sasshi 的「柱」） -->
<div class="hashira" aria-hidden="true"><span data-i18n="hashira">向博 · 个人主页</span></div>

<!-- ============ 全屏大图 + 可拖拽的 5 件纸上物 ============ -->
<div class="constellation" id="constellation">
  <div class="constellation-bg" style="background-image:url('assets/images/home-bg.jpg')"></div>
  <div class="constellation-veil"></div>

  <div class="constellation-name" aria-hidden="true">
    <span class="cn">向博</span>
    <span class="en">Xiang Bo</span>
  </div>

  <!-- 名片 → 关于 -->
  <a class="paper paper-card" href="about.html" style="--r:-2.4deg">
    <span class="paper-in">
      <span class="card-face">
        <span class="card-name">向博<span class="card-name-en">Xiang Bo</span></span>
        <span class="card-rule"></span>
        <span class="card-role" data-i18n="objCardRole">上海交通大学 · 安泰经济与管理学院</span>
      </span>
      <span class="paper-tag" data-i18n="navAbout">关于</span>
    </span>
  </a>

  <!-- 门票 → 足迹 -->
  <a class="paper paper-ticket" href="journey.html" style="--r:1.8deg">
    <span class="paper-in">
      <span class="ticket-face">
        <span class="ticket-title" data-i18n="objTicketTitle">足迹 TICKET</span>
        <span class="ticket-no">NO. 0526</span>
        <span class="ticket-line" data-i18n="objTicketLine">实习 · 校园 · 公益</span>
      </span>
      <span class="paper-tag" data-i18n="navJourney">足迹</span>
    </span>
  </a>

  <!-- 便笺 → 随笔 -->
  <a class="paper paper-note" href="essays.html" style="--r:2.6deg">
    <span class="paper-in">
      <span class="note-face">
        <span class="note-text" data-i18n="objNoteLine">慢慢写，慢慢放。</span>
      </span>
      <span class="paper-tag" data-i18n="navEssays">随笔</span>
    </span>
  </a>

  <!-- 拍立得 → 相册 -->
  <a class="paper paper-polaroid" href="gallery.html" style="--r:-1.6deg">
    <span class="paper-in">
      <span class="polaroid-face">
        <img src="assets/images/module-gallery.jpg" alt="" onerror="this.onerror=null;this.src='assets/gallery/placeholder-6.svg?v=2'">
        <span class="polaroid-cap" data-i18n="objPolaroidCap">那些路上的光</span>
      </span>
      <span class="paper-tag" data-i18n="navGallery">相册</span>
    </span>
  </a>

  <!-- 明信片 → 联络 -->
  <a class="paper paper-postcard" href="contact.html" style="--r:2.2deg">
    <span class="paper-in">
      <span class="postcard-face">
        <span class="postcard-stamp"></span>
        <span class="postcard-lines">
          <span class="postcard-line" data-i18n="objPostcardLine1">见字如面。</span>
          <span class="postcard-line small" data-i18n="objPostcardLine2">欢迎写信给我。</span>
        </span>
      </span>
      <span class="paper-tag" data-i18n="navContact">联络</span>
    </span>
  </a>
</div>

<!-- 底部一行"印刷文字"控件（sasshi 式：无按钮容器） -->
<div class="desk-line">
  <span class="desk-hint" data-i18n="objHint">拖动它们，或点进去看看</span>
  <span class="desk-sep">·</span>
  <button class="desk-word" id="reshuffle" data-i18n="objReset">重新摆放</button>
</div>

<!-- 点击模块时的暗场层 -->
<div class="orb-veil" id="orbVeil"></div>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
